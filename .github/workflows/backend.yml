name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Build the admin panel and server
        run: npm run build

      - name: Test roles, public API and rebuild trigger
        run: npm test

  backend-image:
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t backend:test backend

      - name: Start the image and check that it is healthy
        run: scripts/smoke-test.sh backend:test

      - name: Log in to the GitHub container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: github.event_name == 'push'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag backend:test "$image:$tag"
            docker push "$image:$tag"
          done
